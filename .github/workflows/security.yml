# Workflow: Security Scan
# Description: Runs Trivy and TruffleHog to detect vulnerabilities and secrets
# Why: Proactively ensures security

name: Security Scan

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      # Pinned to v0.36.0 (supply chain)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_DISABLE_VEX_NOTICE: "1"
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      # Pinned to v3.95.3 (supply chain)
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          extra_args: --results=verified,unverified
