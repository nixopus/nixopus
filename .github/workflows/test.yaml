# Workflow: Go Tests
# Runs Go vet + race-safe unit tests with coverage gate, then full
# integration tests against Postgres, Redis, and Better Auth services.

name: Test Nixopus API

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'api/**'
      - 'docker-compose-test.yml'
      - '.github/workflows/test.yaml'
  workflow_call:
    secrets:
      DEPLOY_KEY:
        required: false
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'docker-compose-test.yml'
              - '.github/workflows/test.yaml'

  # Fast quality gate — no infrastructure required.
  # Fails the PR before expensive integration tests run.
  quality-gate:
    needs: detect-changes
    if: |
      always() &&
      (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.api == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
          cache-dependency-path: api/go.sum

      - name: Vet
        working-directory: api
        run: go vet ./...

      - name: Unit tests (race detector + coverage)
        working-directory: api
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic \
            ./internal/features/... \
            -count=1 -timeout 300s

      - name: Enforce coverage threshold (≥80%)
        working-directory: api
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Unit test coverage: ${TOTAL}%"
          if awk "BEGIN {exit !(${TOTAL} + 0 < 80)}"; then
            echo "FAIL: coverage ${TOTAL}% is below the 80% threshold"
            exit 1
          fi
          echo "PASS: coverage ${TOTAL}% meets the 80% threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage.out
          retention-days: 7

  test:
    needs: [detect-changes, quality-gate]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.api == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
          cache-dependency-path: api/go.sum

      - name: Start test infrastructure
        env:
          NIXOPUS_AUTH_IMAGE: ghcr.io/nixopus/auth:latest
        run: |
          docker compose -f docker-compose-test.yml up -d --wait --wait-timeout 180
          docker compose -f docker-compose-test.yml ps

      - name: Build and start API server
        working-directory: api
        env:
          PORT: "8080"
          DATABASE_URL: postgresql://nixopus:nixopus@localhost:5433/nixopus_test
          REDIS_URL: redis://localhost:6379
          AUTH_SERVICE_URL: http://localhost:9090
          AUTH_SERVICE_SECRET: test-secret-for-ci
          ALLOWED_ORIGIN: http://localhost:3000,http://localhost:8080
          CADDY_PORT: "2019"
          ENV: test
        run: |
          go build -o bin/nixopus-api
          ./bin/nixopus-api &
          echo $! > /tmp/api-server.pid

          api_ready=0
          for i in {1..15}; do
            if curl -sf http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              echo "API server is ready"
              api_ready=1
              break
            fi
            echo "Waiting for API server... attempt $i"
            sleep 2
          done
          if [ "$api_ready" -ne 1 ]; then
            echo "API server failed to become ready"
            exit 1
          fi

      - name: Run integration tests (race detector)
        working-directory: api
        env:
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_USER: nixopus
          DB_PASSWORD: nixopus
          DB_NAME: nixopus_test
          REDIS_URL: redis://localhost:6379
          AUTH_SERVICE_URL: http://localhost:9090
        run: go test -race -p 1 ./... -v -count=1

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose-test.yml logs

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/api-server.pid ]; then
            kill "$(cat /tmp/api-server.pid)" 2>/dev/null || true
          fi
          docker compose -f docker-compose-test.yml down -v
