# Opens dependency-bump PRs automatically, so the Security Scan (Trivy) does
# not drift back into failure as new CVEs are published.
#
# Version updates run on the schedule below. Security updates are separate and
# are raised as soon as an advisory lands, but only while "Dependabot security
# updates" is enabled in the repository settings.
#
# Minor and patch bumps are grouped into one PR per ecosystem to keep the
# review load down. Majors are raised individually because they need thought.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      go-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Both view/package-lock.json and view/yarn.lock are committed and both are
  # scanned by Trivy, so they have to move together.
  - package-ecosystem: npm
    directory: /view
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      root-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /api
      - /view
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
