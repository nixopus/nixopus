services:
  bookstack:
    image: ${IMAGE:-lscr.io/linuxserver/bookstack}:${TAG:-latest}
    container_name: ${CONTAINER_NAME:-bookstack}
    ports:
      - "${HOST_PORT:-6875}:${CONTAINER_PORT:-80}"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE:-Etc/UTC}
      APP_URL: ${APP_URL:-}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_DATABASE: ${DB_DATABASE:-}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-}
    volumes:
      - bookstack-config:/config
    restart: unless-stopped

volumes:
  bookstack-config:
