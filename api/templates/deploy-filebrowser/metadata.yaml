metadata:
  id: "deploy-filebrowser"
  name: "File Browser"
  description: "File Browser provides a web interface to manage files and folders"
  author: "Nixopus Team"
  icon: "https://raw.githubusercontent.com/filebrowser/filebrowser/master/branding/banner.png"
  category: "Storage"
  type: "install"
  version: "1.0.0"
  isVerified: false

variables:
  image:
    type: "string"
    description: "Docker image for File Browser"
    default: "filebrowser/filebrowser"
    is_required: true

  tag:
    type: "string"
    description: "Docker image tag"
    default: "latest"
    is_required: true

  container_name:
    type: "string"
    description: "Name of the File Browser container"
    default: "filebrowser"
    is_required: true

  host_port:
    type: "integer"
    description: "Host port to expose File Browser"
    default: 8080
    is_required: true

  data_volume:
    type: "string"
    description: "Named Docker volume for /srv"
    default: "filebrowser_data"
    is_required: true

  db_volume:
    type: "string"
    description: "Named Docker volume for /database"
    default: "filebrowser_database"
    is_required: true

  config_volume:
    type: "string"
    description: "Named Docker volume for /config"
    default: "filebrowser_config"
    is_required: true

  proxy_domain:
    type: "string"
    description: "Domain name for File Browser (optional)"
    default: ""
    is_required: false
