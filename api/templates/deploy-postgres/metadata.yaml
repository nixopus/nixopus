metadata:
  id: "deploy-postgres"
  name: "PostgreSQL"
  description: "PostgreSQL is a powerful, open source object-relational database system with over 30 years of active development that has earned it a strong reputation for reliability, feature robustness, and performance."
  author: "Nixopus Team"
  icon: "https://www.postgresql.org/media/img/about/press/elephant.png"
  category: "Database"
  type: "install"
  version: "1.0.0"
  isVerified: false
  featured: true

variables:
  image:
    type: "string"
    description: "Docker image for PostgreSQL"
    default: "postgres"
    is_required: true

  tag:
    type: "string"
    description: "Docker image tag"
    default: "15-alpine"
    is_required: true

  container_name:
    type: "string"
    description: "Name of the PostgreSQL container"
    default: "postgres"
    is_required: true

  host_port:
    type: "integer"
    description: "Host port to expose PostgreSQL"
    default: 5432
    is_required: true

  container_port:
    type: "integer"
    description: "Container port for PostgreSQL"
    default: 5432
    is_required: true

  database_name:
    type: "string"
    description: "Name of the default database to create"
    default: "postgres"
    is_required: true

  postgres_user:
    type: "string"
    description: "PostgreSQL superuser name"
    default: "postgres"
    is_required: true

  postgres_password:
    type: "string"
    description: "PostgreSQL superuser password"
    default: "postgres"
    is_required: true

  data_volume_name:
    type: "string"
    description: "Named Docker volume for PostgreSQL data persistence"
    default: "postgres-data"
    is_required: true

  init_scripts_volume:
    type: "string"
    description: "Named Docker volume for initialization scripts (optional)"
    default: "postgres-init-scripts"
    is_required: false
