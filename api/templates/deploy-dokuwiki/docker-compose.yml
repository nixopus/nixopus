services:
  dokuwiki:
    image: ${IMAGE:-lscr.io/linuxserver/dokuwiki}:${TAG:-latest}
    container_name: ${CONTAINER_NAME:-dokuwiki}
    ports:
      - "${HTTP_HOST_PORT:-80}:${HTTP_CONTAINER_PORT:-80}"
      - "${HTTPS_HOST_PORT:-443}:${HTTPS_CONTAINER_PORT:-443}"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE:-Etc/UTC}
    volumes:
      - ${CONFIG_VOLUME_NAME:-dokuwiki-config}:/config
    restart: unless-stopped

volumes:
  ${CONFIG_VOLUME_NAME:-dokuwiki-config}:
