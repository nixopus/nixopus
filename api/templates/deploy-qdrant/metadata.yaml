metadata:
  id: "deploy-qdrant"
  name: "Qdrant"
  description: "Qdrant is a vector similarity search engine and vector database"
  author: "Nixopus Team"
  icon: "https://qdrant.tech/img/qdrant-logo.svg"
  category: "Database"
  type: "install"
  version: "1.0.0"
  isVerified: false

variables:
  image:
    type: "string"
    description: "Docker image for Qdrant"
    default: "qdrant/qdrant"
    is_required: true

  tag:
    type: "string"
    description: "Docker image tag"
    default: "latest"
    is_required: true

  container_name:
    type: "string"
    description: "Name of the Qdrant container"
    default: "qdrant"
    is_required: true

  rest_port:
    type: "integer"
    description: "Host port to expose Qdrant REST API"
    default: 6333
    is_required: true

  grpc_port:
    type: "integer"
    description: "Host port to expose Qdrant gRPC API"
    default: 6334
    is_required: true

  rest_container_port:
    type: "integer"
    description: "Container port for Qdrant REST API"
    default: 6333
    is_required: true

  grpc_container_port:
    type: "integer"
    description: "Container port for Qdrant gRPC API"
    default: 6334
    is_required: true

  storage_volume_name:
    type: "string"
    description: "Named Docker volume for Qdrant data persistence"
    default: "qdrant-storage"
    is_required: true

  api_key:
    type: "string"
    description: "API key for Qdrant authentication (leave empty for no authentication)"
    default: ""
    is_required: false

  log_level:
    type: "string"
    description: "Logging level (INFO, DEBUG, WARN, ERROR)"
    default: "INFO"
    is_required: false

  proxy_domain:
    type: "string"
    description: "Domain name for Qdrant (optional)"
    default: ""
    is_required: false
