metadata:
  id: "deploy-minio"
  name: "MinIO"
  description: "Minio is a high-performance, S3-compatible object storage system designed for private cloud and AI/ML workloads"
  author: "Nixopus Team"
  icon: "https://avatars.githubusercontent.com/u/695951?s=48&v=4"
  category: "Storage"
  type: "install"
  version: "1.0.0"
  isVerified: false
  featured: true

variables:
  image:
    type: "string"
    description: "Docker image for MinIO"
    default: "minio/minio"
    is_required: true

  tag:
    type: "string"
    description: "Docker image tag"
    default: "latest"
    is_required: true

  container_name:
    type: "string"
    description: "Name of the MinIO container"
    default: "minio"
    is_required: true

  api_port:
    type: "integer"
    description: "Host port to expose MinIO API"
    default: 9000
    is_required: true

  console_port:
    type: "integer"
    description: "Host port to expose MinIO Console"
    default: 9001
    is_required: true

  access_key:
    type: "string"
    description: "MINIO_ROOT_USER"
    default: "minioadmin"
    is_required: true

  secret_key:
    type: "string"
    description: "MINIO_ROOT_PASSWORD"
    default: "minioadmin"
    is_required: true

  default_buckets:
    type: "string"
    description: "Comma-separated list of buckets to create (optional, official image ignores this)"
    default: ""
    is_required: false

  volume_name:
    type: "string"
    description: "Named Docker volume for MinIO data"
    default: "minio-data"
    is_required: true

  proxy_domain:
    type: "string"
    description: "Domain name for MinIO Console (optional)"
    default: ""
    is_required: false
