services:
  mastodon:
    image: ${IMAGE:-lscr.io/linuxserver/mastodon}:${TAG:-latest}
    container_name: ${CONTAINER_NAME:-mastodon}
    ports:
      - "${HTTP_HOST_PORT:-80}:${HTTP_CONTAINER_PORT:-80}"
      - "${HTTPS_HOST_PORT:-443}:${HTTPS_CONTAINER_PORT:-443}"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE:-Etc/UTC}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DB_HOST: ${DB_HOST:-}
      DB_USER: ${DB_USER:-mastodon}
      DB_NAME: ${DB_NAME:-mastodon}
      DB_PASS: ${DB_PASS:-}
      DB_PORT: ${DB_PORT:-5432}
      ES_ENABLED: ${ES_ENABLED:-false}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      OTP_SECRET: ${OTP_SECRET:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_LOGIN: ${SMTP_LOGIN:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      S3_ENABLED: ${S3_ENABLED:-false}
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      ES_HOST: ${ES_HOST:-}
      ES_PORT: ${ES_PORT:-9200}
      ES_USER: ${ES_USER:-elastic}
      ES_PASS: ${ES_PASS:-elastic}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ALIAS_HOST: ${S3_ALIAS_HOST:-}
      SIDEKIQ_ONLY: ${SIDEKIQ_ONLY:-false}
      SIDEKIQ_QUEUE: ${SIDEKIQ_QUEUE:-}
      SIDEKIQ_DEFAULT: ${SIDEKIQ_DEFAULT:-false}
      SIDEKIQ_THREADS: ${SIDEKIQ_THREADS:-5}
      DB_POOL: ${DB_POOL:-5}
      NO_CHOWN: ${NO_CHOWN:-}
    volumes:
      - ${CONFIG_VOLUME_NAME:-mastodon-config}:/config
    restart: unless-stopped

volumes:
  ${CONFIG_VOLUME_NAME:-mastodon-config}:
