services:
  appwrite:
    image: ${IMAGE:-appwrite/appwrite}:${TAG:-1.7.4}
    container_name: ${CONTAINER_NAME:-appwrite-installer}
    entrypoint: install
    ports:
      - "${HOST_PORT:-5555}:${CONTAINER_PORT:-80}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_VOLUME_NAME:-appwrite-config}:/usr/src/code/appwrite
    restart: unless-stopped

volumes:
  ${CONFIG_VOLUME_NAME:-appwrite-config}:
