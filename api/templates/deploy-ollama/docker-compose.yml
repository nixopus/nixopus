services:
  ollama:
    image: ${IMAGE:-ollama/ollama}:${TAG:-latest}
    container_name: ${CONTAINER_NAME:-ollama}
    ports:
      - "${HOST_PORT:-11434}:${CONTAINER_PORT:-11434}"
    volumes:
      - ${DATA_VOLUME_NAME:-ollama}:/root/.ollama
    restart: unless-stopped

volumes:
  ${DATA_VOLUME_NAME:-ollama}:
